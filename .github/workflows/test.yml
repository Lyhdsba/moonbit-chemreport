name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: |
          moon version --all
          moon update

      - name: Format
        run: moon fmt --check

      - name: Check
        run: moon check --target all --deny-warn

      - name: Native build
        run: moon build --target native

      - name: Interface info
        run: |
          moon info
          git diff --exit-code

      - name: Test
        run: moon test --target all --deny-warn

      - name: Count production MoonBit source
        shell: bash
        run: |
          count=$(find . -name '*.mbt' -not -path './_build/*' -not -name '*_test.mbt' -not -name '*_wbtest.mbt' -print0 | xargs -0 cat | wc -l)
          test "$count" -ge 8000
          echo "production MoonBit source lines: $count"
